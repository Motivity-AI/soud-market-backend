const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => document.querySelectorAll(sel);

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatPrice(price, currency) {
  const sym = { SDG:'ج.س', USD:'$', SAR:'ر.س' }[currency] ?? currency;
  return `${Number(price).toLocaleString('ar-EG')} ${sym}`;
}

function timeAgo(date) {
  const s = (Date.now() - new Date(date).getTime()) / 1000;
  if (s < 60) return 'الآن';
  if (s < 3600) return `قبل ${Math.floor(s/60)} دقيقة`;
  if (s < 86400) return `قبل ${Math.floor(s/3600)} ساعة`;
  if (s < 2592000) return `قبل ${Math.floor(s/86400)} يوم`;
  return new Date(date).toLocaleDateString('ar-EG');
}

function isNew(date, hours = 24) {
  return (Date.now() - new Date(date).getTime()) < hours * 3600 * 1000;
}

function waLink(phone, name) {
  let n = (phone ?? '').replace(/\D/g, '');
  if (n.startsWith('0')) n = '249' + n.slice(1);
  else if (!n.startsWith('249')) n = '249' + n;
  const text = encodeURIComponent(`السلام عليكم، شفت منتج "${name}" في بورصة السودان. هل ما زال متاحاً؟`);
  return `https://wa.me/${n}?text=${text}`;
}

function getEmoji(p) {
  if (p.emoji) return p.emoji;
  const map = { food:'🌾',vegetables:'🥬',meat:'🥩',medicine:'💊',
    clothing:'👕',electronics:'📱',construction:'🧱',cars:'🚗',other:'📦' };
  return map[p.category_slug] ?? '📦';
}

function toast(msg, type = 'success') {
  const colors = {
    success: 'bg-green-600', error: 'bg-red-600',
    info: 'bg-blue-600', warn: 'bg-amber-600'
  };
  const icons = { success:'✅', error:'⚠️', info:'ℹ️', warn:'⏳' };
  const el = document.createElement('div');
  el.className = `${colors[type]} text-white px-4 py-3 rounded-xl shadow-lg toast-anim text-sm flex items-center gap-2`;
  el.innerHTML = `<span>${icons[type]}</span><span>${esc(msg)}</span>`;
  $('#toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, 3000);
}

function loadRates() {
  try {
    const raw = localStorage.getItem('sm_rates');
    return raw ? JSON.parse(raw) : { SDG:1, USD:1/600, SAR:1/160, updatedAt:new Date().toISOString() };
  } catch { return { SDG:1, USD:1/600, SAR:1/160, updatedAt:new Date().toISOString() }; }
}
function saveRates(r) {
  state.rates = { ...state.rates, ...r, updatedAt:new Date().toISOString() };
  localStorage.setItem('sm_rates', JSON.stringify(state.rates));
  window.dispatchEvent(new CustomEvent('rates-updated'));
}
function convertPrice(amount, from, to) {
  if (from === to) return amount;
  const r = state.rates;
  return (amount / r[from]) * r[to];
}

// ============================================================================
//  7) IndexedDB للطابور المحلي
// ============================================================================
const DB_NAME = 'sm_offline', DB_VER = 1;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains('queue')) db.createObjectStore('queue', { keyPath:'localId' });
      if (!db.objectStoreNames.contains('cache')) db.createObjectStore('cache', { keyPath:'id' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbPut(store, val) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(val);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
async function idbGetAll(store) {
  try {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readonly');
      const r = tx.objectStore(store).getAll();
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  } catch { return []; }
}
async function idbDel(store, key) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
async function enqueue(action) {
  const item = { ...action, localId: `${Date.now()}-${Math.random().toString(36).slice(2,7)}`, createdAt: new Date().toISOString() };
  await idbPut('queue', item);
  await refreshPending();
  return item.localId;
}
async function refreshPending() {
  state.pending = (await idbGetAll('queue')).length;
  renderNetBanner();
}
async function syncPending() {
  const items = await idbGetAll('queue');
  let synced = 0, failed = 0;
  for (const it of items) {
    try {
      if (it.type === 'insert') await sb.from('products').insert(it.payload);
      else if (it.type === 'update') await sb.from('products').update(it.payload).eq('id', it.id);
      else if (it.type === 'delete') await sb.from('products').delete().eq('id', it.id);
      await idbDel('queue', it.localId);
      synced++;
    } catch { failed++; }
  }
  await refreshPending();
  return { synced, failed };
}

//  8) المصادقة
// ============================================================================
async function loadSession() {
  const { data: { session } } = await sb.auth.getSession();
  state.user = session?.user ?? null;
  if (state.user) await loadProfile();
}
async function loadProfile() {
  if (!state.user) { state.profile = null; return; }
  const { data } = await sb.from('profiles').select('*').eq('id', state.user.id).single();
  state.profile = data;
}
async function signUp(form) {
  const { error } = await sb.auth.signUp({
    email: form.email, password: form.password,
    options: { data: { full_name: form.full_name, phone: form.phone, state: form.state, city: form.city } }
  });
  if (error) throw error;
}
async function signIn(email, password) {
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) throw error;
  await loadSession();
}
async function signOut() {
  await sb.auth.signOut();
  state.user = null; state.profile = null;
  location.hash = '#/';
  render();
}

  state.categories = data ?? [];
}
async function loadProducts() {
  const { data } = await sb.from('product_feed').select('*').order('created_at', { ascending:false }).limit(60);
  state.products = data ?? [];
  for (const p of state.products) await idbPut('cache', p).catch(()=>{});
}
async function loadMyProducts() {
  if (!state.user) return;
  const { data } = await sb.from('product_feed').select('*').eq('trader_id', state.user.id).order('created_at', { ascending:false });

}
async function loadAdminData() {
  if (state.profile?.role !== 'admin') return;
  const [reports, traders, products] = await Promise.all([
    sb.from('reports').select('*, product:products(name), reporter:profiles!reporter_id(full_name)').eq('status','pending').order('created_at',{ascending:false}),
    sb.from('profiles').select('*').order('created_at',{ascending:false}).limit(100),
    sb.from('product_feed').select('*').order('created_at',{ascending:false}).limit(100)
  ]);
  state.reports = reports.data ?? [];
  state.traders = traders.data ?? [];
  state.adminProducts = products.data ?? [];
}

  } else if (!state.offline && state.pending > 0) {
    el.className = 'text-sm px-4 py-2.5 flex items-center justify-between gap-3 bg-blue-50 border-b border-blue-200 text-blue-900';
    el.innerHTML = `<div class="flex items-center gap-2">☁️ <span>${state.pending} منتج بانتظار النشر</span></div>
      <button onclick="window.__sync()" class="text-xs bg-blue-600 text-white px-3 py-1 rounded-lg">نشر الآن</button>`;
    el.classList.remove('hidden');
  } else if (state.offline && state.pending > 0) {
    el.className = 'text-sm px-4 py-2.5 flex items-center justify-between gap-3 bg-amber-50 border-b border-amber-200 text-amber-900';
    el.innerHTML = `<div class="flex items-center gap-2">📴 <span>غير متصل — ${state.pending} منتج بانتظار النشر</span></div>`;
    el.classList.remove('hidden');
  } else {
    el.classList.add('hidden');
  }
}

function parseHash() {
  const h = location.hash.replace(/^#/, '') || '/';
  const parts = h.split('/').filter(Boolean);
  return { path: h, parts };
}

async function render() {
  const { path, parts } = parseHash();
  const app = $('#app');
  state.route = path;

  if (parts.length === 0) {
    if (state.products.length === 0) await loadProducts();
    app.innerHTML = viewHome();
    bindHomeEvents();
  }
  else if (parts[0] === 'product' && parts[1]) {
    if (state.products.length === 0) await loadProducts();
    app.innerHTML = viewProduct(parts[1]);
    trackView(parts[1]);
  }
  else if (parts[0] === 'login') {
    app.innerHTML = viewLogin();
    bindLogin();
  }
  else if (parts[0] === 'register') {
    app.innerHTML = viewRegister();
    bindRegister();
  }
  else if (parts[0] === 'dashboard') {
    if (!state.user) { location.hash = '#/login'; return; }
    await loadMyProducts();
    app.innerHTML = viewDashboard();
  }
  else if (parts[0] === 'new') {
    app.innerHTML = viewProductForm();
    bindProductForm(null);
  }
  else if (parts[0] === 'edit' && parts[1]) {
    if (!state.user) { location.hash = '#/login'; return; }
    if (state.myProducts.length === 0) await loadMyProducts();
    const p = state.myProducts.find(x => x.id === parts[1]);
    if (!p) { toast('المنتج غير موجود', 'error'); location.hash = '#/dashboard'; return; }
    app.innerHTML = viewProductForm(p);
    bindProductForm(p);
  }
  else if (parts[0] === 'admin') {
    if (!state.user) { location.hash = '#/login'; return; }
    if (state.profile?.role !== 'admin') { toast('غير مصرح', 'error'); location.hash = '#/'; return; }
    await loadAdminData();
    app.innerHTML = viewAdmin();
    bindAdmin();
  }
  else {
    app.innerHTML = emptyState('الصفحة غير موجودة', 'تحقق من الرابط');
  }

  renderNav();
  renderNetBanner();
}

function bindHomeEvents() {
  const f = state.filters;
  const q = $('#f-q');
  if (q) {
    let t;
    q.addEventListener('input', e => {
      clearTimeout(t);
      t = setTimeout(() => { state.filters.q = e.target.value; render(); }, 250);
    });
  }
  const cat = $('#f-cat');
  if (cat) cat.addEventListener('change', e => { state.filters.category = e.target.value; render(); });
  const st = $('#f-state');
  if (st) st.addEventListener('change', e => { state.filters.state = e.target.value; render(); });
}

function bindLogin() {
  $('#login-form')?.addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const btn = e.target.querySelector('button');
    btn.disabled = true; btn.textContent = '...';
    try {
      await signIn(fd.get('email'), fd.get('password'));
      toast('مرحباً بك');
      location.hash = '#/dashboard';
    } catch (err) {
      toast(err.message || 'فشل الدخول', 'error');
      btn.disabled = false; btn.textContent = 'دخول';
    }
  });
}

function bindRegister() {
  $('#register-form')?.addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const btn = e.target.querySelector('button');
    btn.disabled = true; btn.textContent = '...';
    try {
      await signUp(Object.fromEntries(fd));
      toast('تم التسجيل! تحقق من بريدك الإلكتروني');
      setTimeout(() => location.hash = '#/login', 1500);
    } catch (err) {
      toast(err.message || 'فشل التسجيل', 'error');
      btn.disabled = false; btn.textContent = 'إنشاء الحساب';
    }
  });
}

function bindProductForm(initial) {
  const form = $('#product-form');
  if (!form) return;

  $$('.emoji-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const emoji = btn.dataset.emoji;
      $('#emoji-input').value = emoji;
      $('#emoji-preview').textContent = emoji;
      $$('.emoji-btn').forEach(b => {
        b.classList.toggle('bg-brand-600', b.dataset.emoji === emoji);
        b.classList.toggle('ring-2', b.dataset.emoji === emoji);
        b.classList.toggle('ring-brand-300', b.dataset.emoji === emoji);
      });
    });
  });

  $('#emoji-input')?.addEventListener('input', e => {
    $('#emoji-preview').textContent = e.target.value || '📦';
  });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(form);
    const btn = $('#pf-submit');
    btn.disabled = true; btn.textContent = '...';

    const payload = {
      name: fd.get('name').trim(),
      description: fd.get('description').trim() || null,
      category_id: Number(fd.get('category_id')) || null,
      emoji: fd.get('emoji').trim() || '📦',
      qty: Number(fd.get('qty')),
      unit: fd.get('unit'),
      price: Number(fd.get('price')),
      currency: fd.get('currency'),
      state: fd.get('state'),
      city: fd.get('city').trim() || null,
      market: fd.get('market').trim() || null,
      min_order: Number(fd.get('min_order')) || 1,
      trader_id: state.user.id
    };

    try {
      if (!navigator.onLine) {
        const id = initial?.id;
        await enqueue(id
          ? { type:'update', id, payload }
          : { type:'insert', payload });
        toast('📥 تم الحفظ محلياً — سيُنشر عند عودة الإنترنت', 'info');
        location.hash = '#/dashboard';
        return;
      }

      const id = initial?.id;
      const { error } = id
        ? await sb.from('products').update(payload).eq('id', id)
        : await sb.from('products').insert(payload);
      if (error) throw error;
      toast(id ? 'تم التحديث' : 'تم نشر المنتج');
      location.hash = '#/dashboard';
    } catch (err) {
      toast(err.message || 'فشل الحفظ', 'error');
      btn.disabled = false;
      btn.textContent = initial ? 'حفظ التعديلات' : 'نشر المنتج';
    }
  });
}

function bindAdmin() {
  $$('.admin-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      $$('.admin-tab').forEach(t => {
        t.classList.remove('border-brand-600','text-brand-700');
        t.classList.add('border-transparent','text-gray-500');
      });
      tab.classList.remove('border-transparent','text-gray-500');
      tab.classList.add('border-brand-600','text-brand-700');

      const target = tab.dataset.tab;
      $$('[data-panel]').forEach(p => {
        p.classList.toggle('hidden', p.dataset.panel !== target);
      });
    });
  });
}

// ============================================================================
//  16) Realtime
// ============================================================================
function setupRealtime() {
  sb.channel('products-live')
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'products' }, async (payload) => {
      const { data } = await sb.from('product_feed').select('*').eq('id', payload.new.id).single();
      if (data) {
        state.products = [data, ...state.products.filter(x => x.id !== data.id)];
        if (state.route === '/' ) render();
        toast(`🆕 منتج جديد: ${data.name}`, 'info');
      }
    })
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'products' }, (payload) => {
      state.products = state.products.map(p => p.id === payload.new.id ? { ...p, ...payload.new } : p);
      state.myProducts = state.myProducts.map(p => p.id === payload.new.id ? { ...p, ...payload.new } : p);
      if (['/','/dashboard'].includes(state.route)) render();
    })
    .subscribe();
}

// ============================================================================
//  17) كشف حالة الشبكة
// ============================================================================
function setupNetwork() {
  const update = () => {
    state.offline = !navigator.onLine;
    renderNetBanner();
    if (!state.offline && state.pending > 0) {
      setTimeout(async () => {
        const { synced, failed } = await syncPending();
        if (synced > 0) toast(`✅ تم نشر ${synced} منتج`, 'success');
        if (failed > 0) toast(`⚠️ فشل نشر ${failed}`, 'error');
        render();
      }, 1000);
    }
  };
  window.addEventListener('online', update);
  window.addEventListener('offline', update);
  state.offline = !navigator.onLine;
}

// ============================================================================
//  18) Service Worker (inline)
// ============================================================================
if ('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
    self.addEventListener('fetch', e => {
      const url = new URL(e.request.url);
      if (url.hostname.includes('supabase') || e.request.method !== 'GET') return;
      e.respondWith(
        caches.open('sm-v1').then(c =>
          c.match(e.request).then(r => r || fetch(e.request).then(res => {
            if (res.status === 200 && res.type !== 'opaque') c.put(e.request, res.clone());
            return res;
          }).catch(() => r))
        )
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
}

// ============================================================================
//  19) الدوال المعرّضة للنطاق العام
// ============================================================================
window.__logout = signOut;
window.__sync = async () => {
  const { synced, failed } = await syncPending();
  if (synced > 0) toast(`✅ تم نشر ${synced} منتج`);
  if (failed > 0) toast(`⚠️ فشل ${failed}`, 'error');
  render();
};
window.__click = trackClick;
window.__clearFilters = () => {
  state.filters = { q:'', category:'', state:'' };
  render();
};
window.__saveRates = () => {
  const usd = Number($('#rate-usd').value);
  const sar = Number($('#rate-sar').value);
  if (!usd || !sar || usd <= 0 || sar <= 0) return toast('أسعار غير صحيحة', 'error');
  saveRates({ USD: 1/usd, SAR: 1/sar });
  toast('✅ تم حفظ أسعار الصرف');
};
window.__resolveReport = async (id, action) => {
  await sb.from('reports').update({ status: action, reviewed_at: new Date().toISOString() }).eq('id', id);
  state.reports = state.reports.filter(r => r.id !== id);
  toast(action === 'resolved' ? 'تم الحل' : 'تم التجاهل');
  render();
};
window.__banTrader = async (id, banned) => {
  await sb.from('profiles').update({ is_banned: banned }).eq('id', id);
  state.traders = state.traders.map(t => t.id === id ? { ...t, is_banned: banned } : t);
  toast(banned ? 'تم الحظر' : 'تم رفع الحظر');
  render();
};
window.__verifyTrader = async (id, verified) => {
  await sb.from('profiles').update({ is_verified: verified }).eq('id', id);
  state.traders = state.traders.map(t => t.id === id ? { ...t, is_verified: verified } : t);
  toast(verified ? '✅ تم التوثيق' : 'تم إلغاء التوثيق');
  render();
};
window.__banProduct = async (id) => {
  await sb.from('products').update({ status: 'banned' }).eq('id', id);
  state.adminProducts = state.adminProducts.filter(p => p.id !== id);
  toast('تم حظر المنتج');
  render();
};

// ============================================================================
//  20) نقطة البداية
// ============================================================================
async function init() {
  try {
    await loadCategories();
    await loadSession();
    await refreshPending();
    setupRealtime();
    setupNetwork();
    await render();
  } catch (err) {
    console.error(err);
    $('#app').innerHTML = `<div class="bg-red-50 border border-red-200 rounded-2xl p-6 text-center">
      <div class="text-4xl mb-3">⚠️</div>
      <h2 class="font-bold mb-2">حدث خطأ في التحميل</h2>
      <p class="text-sm text-red-700 mb-4">${esc(err.message)}</p>
      <p class="text-xs text-gray-500">تأكد من تشغيل schema.sql في Supabase SQL Editor</p>
    </div>`;
  }
}

window.addEventListener('hashchange', render);
init();
</script>
