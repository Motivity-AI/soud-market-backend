<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOUD MARKET | Cloud Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        :root { --primary: #FFD700; --dark: #0f172a; --accent: #3b82f6; --bg: #f8fafc; --success: #22c55e; --danger: #ef4444; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; transition: 0.3s; }
        body { margin: 0; background: var(--bg); padding-bottom: 90px; }
        
        header { background: var(--dark); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
        .logo-area { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo-dot { width: 35px; height: 35px; background: var(--primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: black; font-weight: 900; }
        
        .page-section { display: none; padding: 15px; animation: fadeIn 0.4s ease; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .card { background: white; border-radius: 20px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 15px; border: 1px solid #eef2f6; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; }
        
        .btn { border: none; padding: 12px; border-radius: 12px; cursor: pointer; font-weight: 700; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
        .btn-main { background: var(--dark); color: white; }
        .btn-upload { background: #e2e8f0; color: #475569; border: 2px dashed #cbd5e1; }
        
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd; outline: none; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; padding: 12px; border-top: 1px solid #eef2f6; z-index: 1000; }
        .nav-link { flex: 1; text-align: center; font-size: 0.75rem; color: #64748b; cursor: pointer; }
        .nav-link.active { color: var(--accent); font-weight: 700; }
        .hidden { display: none !important; }
        #image-preview { width: 100%; height: 150px; object-fit: cover; border-radius: 10px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<header>
    <div class="logo-area" id="master-trigger">
        <div class="logo-dot">S</div>
        <div style="font-weight: 900; letter-spacing: 1px;">SOUD MARKET</div>
    </div>
    <div onclick="nav('cart-page')" style="cursor:pointer; position:relative;">
        <i class="fa-solid fa-cart-shopping fa-xl"></i>
        <span id="cart-count" style="position:absolute; top:-8px; right:-8px; background:var(--danger); color:white; border-radius:50%; width:18px; height:18px; font-size:0.6rem; display:flex; align-items:center; justify-content:center;">0</span>
    </div>
</header>

<section id="shop-page" class="page-section active">
    <div style="margin-bottom:20px;">
        <input type="text" id="search" placeholder="🔍 ابحث عن أي شيء..." onkeyup="filterShop()">
    </div>
    <div id="product-grid" class="grid"></div>
</section>

<section id="cart-page" class="page-section">
    <h3>🛒 سلة مشترياتك</h3>
    <div id="cart-list"></div>
    <div id="checkout-ui" class="card hidden">
        <div style="display:flex; justify-content:space-between; font-weight:900; font-size:1.2rem; margin-bottom:15px;">
            <span>الإجمالي المستحق:</span>
            <span id="total-price" style="color:var(--danger);">0 ج.س</span>
        </div>
        <input type="text" id="order-addr" placeholder="العنوان بالتفصيل">
        <input type="tel" id="order-tel" placeholder="رقم الموبايل">
        <button class="btn btn-main" style="background:var(--success);" onclick="submitOrder()">إتمام الطلب</button>
    </div>
</section>

<section id="account-page" class="page-section">
    <div id="auth-box" class="card">
        <h3>الدخول للمنصة</h3>
        <div id="reg-box" class="hidden">
            <input type="text" id="reg-n" placeholder="الاسم">
            <select id="reg-r">
                <option value="customer">عميل</option>
                <option value="vendor">تاجر</option>
            </select>
        </div>
        <input type="email" id="auth-e" placeholder="الإيميل">
        <input type="password" id="auth-p" placeholder="الباسورد">
        <button class="btn btn-main" onclick="handleAuth()">دخول</button>
        <p onclick="document.getElementById('reg-box').classList.toggle('hidden')" style="text-align:center; color:var(--accent); cursor:pointer; margin-top:10px;">إنشاء حساب جديد</p>
    </div>

    <div id="dash-box" class="hidden">
        <div class="card" style="background:var(--dark); color:white;">
            <h3 id="user-welcome">مرحباً</h3>
            <span id="role-tag" style="color:var(--primary); font-size:0.8rem;"></span>
        </div>

        <div id="vendor-ui" class="hidden">
            <div class="card">
                <h4>➕ إضافة منتج احترافي</h4>
                <input type="text" id="p-title" placeholder="اسم المنتج">
                <input type="number" id="p-cost" placeholder="السعر (ج.س)">
                
                <button class="btn btn-upload" id="upload-btn">
                    <i class="fa-solid fa-cloud-arrow-up"></i> ارفع صورة المنتج من هاتفك
                </button>
                <img id="image-preview">
                <input type="hidden" id="p-img-url">

                <button class="btn btn-main" style="background:var(--accent);" onclick="publishProduct()">نشر المنتج الآن</button>
                <p style="font-size:0.6rem; color:var(--gray); margin-top:5px;">* سيتم خصم عمولة 10% للمنصة عند البيع [cite: 2026-02-09]</p>
            </div>
        </div>

        <div id="admin-ui" class="hidden">
            <div class="card" style="border:1px solid var(--danger);">
                <h4 style="color:var(--danger);">⚖️ التقارير المالية والإدارة</h4>
                <p>كلمة السر المالية: **1988** [cite: 2026-02-06]</p>
                <button class="btn btn-main" onclick="alert('إجمالي العمولات المستحقة: ' + (products.length * 125) + ' ج.س')">كشف الحساب المالي</button>
            </div>
        </div>

        <button class="btn btn-danger" style="margin-top:20px;" onclick="logout()">خروج</button>
    </div>
</section>

<nav class="bottom-nav">
    <div class="nav-link active" onclick="nav('shop-page', this)"><i class="fa-solid fa-house fa-lg"></i><div>السوق</div></div>
    <div class="nav-link" onclick="nav('cart-page', this)"><i class="fa-solid fa-cart-shopping fa-lg"></i><div>السلة</div></div>
    <div class="nav-link" onclick="nav('account-page', this)"><i class="fa-solid fa-user-shield fa-lg"></i><div>حسابي</div></div>
</nav>

<script>
const CONFIG = { 
    API: "https://soud-market-backend.onrender.com/api", 
    CLOUD_NAME: "dynw1r49v", // تم استخراجه من رابطك [cite: 2026-02-25]
    PRESET: "ml_default" 
};

let products = [], cart = [], user = JSON.parse(localStorage.getItem('s_user')), clicks = 0;

// --- نظام الإدارة السرية [cite: 2026-02-24, 2026-02-06] ---
document.getElementById('master-trigger').onclick = () => {
    if(++clicks === 5) {
        if(prompt("كلمة السر المبرمجة:") === "1988") {
            user = { name: "المدير العام", role: "admin", _id: "admin" };
            localStorage.setItem('s_user', JSON.stringify(user));
            location.reload();
        }
        clicks = 0;
    }
};

// --- إعداد Cloudinary للرفع المباشر [cite: 2026-02-25] ---
const myWidget = cloudinary.createUploadWidget({
    cloudName: CONFIG.CLOUD_NAME, 
    uploadPreset: CONFIG.PRESET 
}, (error, result) => { 
    if (!error && result && result.event === "success") { 
        document.getElementById('p-img-url').value = result.info.secure_url;
        document.getElementById('image-preview').src = result.info.secure_url;
        document.getElementById('image-preview').style.display = 'block';
    }
});
document.getElementById("upload-btn").onclick = () => myWidget.open();

// --- الوظائف الأساسية ---
async function init() {
    try {
        const res = await fetch(`${CONFIG.API}/products`);
        products = await res.json();
        renderShop(products);
    } catch(e) { console.log("Re-connecting..."); }
    updateUI();
}

function renderShop(list) {
    document.getElementById('product-grid').innerHTML = list.map(p => `
        <div class="card">
            <img src="${p.img || 'https://via.placeholder.com/150'}" style="width:100%; height:120px; border-radius:12px; object-fit:cover;">
            <h4 style="margin:8px 0; font-size:0.85rem;">${p.name}</h4>
            <div style="color:var(--danger); font-weight:900;">${Number(p.price).toLocaleString()} ج.س</div>
            <button class="btn btn-main" style="padding:8px; font-size:0.7rem; background:var(--primary); color:black;" onclick="addToCart('${p._id}')">🛒 إضافة</button>
        </div>
    `).join('');
}

function addToCart(id) {
    cart.push(products.find(x => x._id === id));
    document.getElementById('cart-count').innerText = cart.length;
    alert("أضيف للسلة");
}

function renderCart() {
    const box = document.getElementById('cart-list');
    if(cart.length === 0) { box.innerHTML = "<center style='padding:40px;'>السلة فارغة</center>"; return; }
    let total = cart.reduce((s, p) => s + Number(p.price), 0);
    box.innerHTML = cart.map((p, i) => `
        <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <div><b>${p.name}</b><br><small>${p.price} ج.س</small></div>
            <i class="fa-solid fa-trash" style="color:var(--danger);" onclick="cart.splice(${i},1); renderCart();"></i>
        </div>
    `).join('');
    document.getElementById('total-price').innerText = total.toLocaleString() + " ج.س";
    document.getElementById('checkout-ui').classList.remove('hidden');
}

async function publishProduct() {
    const name = document.getElementById('p-title').value;
    const price = document.getElementById('p-cost').value;
    const img = document.getElementById('p-img-url').value;
    if(!name || !price || !img) return alert("يرجى رفع الصورة وإكمال البيانات");

    await fetch(`${CONFIG.API}/products`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, price, img, vendorId: user._id })
    });
    alert("تم النشر بنجاح!");
    location.reload();
}

function updateUI() {
    if(!user) return;
    document.getElementById('auth-box').classList.add('hidden');
    document.getElementById('dash-box').classList.remove('hidden');
    document.getElementById('user-welcome').innerText = "مرحباً، " + user.name;
    document.getElementById('role-tag').innerText = user.role === 'admin' ? "المدير العام للمنصة" : "تاجر معتمد";
    if(user.role === 'vendor' || user.role === 'admin') document.getElementById('vendor-ui').classList.remove('hidden');
    if(user.role === 'admin') document.getElementById('admin-ui').classList.remove('hidden');
}

function nav(id, el) {
    document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if(id === 'cart-page') renderCart();
}

function logout() { localStorage.clear(); location.reload(); }
function filterShop() {
    let q = document.getElementById('search').value.toLowerCase();
    renderShop(products.filter(p => p.name.toLowerCase().includes(q)));
}

init();
</script>
</body>
</html>
